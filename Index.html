<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RTL-SDR Live I/Q Plot</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #plot { width: 100%; height: 500px; }
  </style>
</head>
<body>
  <h2>RTL-SDR Live Streaming</h2>
  <div id="plot"></div>
  <p>Status: <span id="status">Connecting...</span></p>

  <script>
    const statusSpan = document.getElementById('status');
    const socket = new WebSocket('ws://localhost:8765');

    socket.onopen = () => {
      statusSpan.textContent = 'Connected';
    };

    socket.onclose = () => {
      statusSpan.textContent = 'Disconnected';
    };

    socket.onerror = (err) => {
      statusSpan.textContent = 'Error';
      console.error('WebSocket error:', err);
    };

    Plotly.newPlot('plot', [{
      x: Array.from({length: 50}, (_, i) => i),
      y: Array(50).fill(0),
      mode: 'lines',
      line: { color: 'blue' },
    }], {
      margin: { t: 30 },
      title: 'Real Part of I/Q Samples',
      xaxis: { title: 'Sample Index' },
      yaxis: { title: 'Amplitude' }
    });

    socket.onmessage = function(event) {
      const msg = JSON.parse(event.data);
      const samples = msg.samples;

      // Extract only real part from interleaved I/Q
      const realPart = [];
      for (let i = 0; i < samples.length; i += 2) {
        realPart.push(samples[i]);
      }

      Plotly.update('plot', { y: [realPart] });
    };
  </script>
</body>
</html>
