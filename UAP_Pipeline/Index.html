<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time RTL-SDR Data</title>
</head>
<body>
    <h1>Real-Time RTL-SDR Data</h1>
    <div id="data"></div>

    <script>
        const socket = new WebSocket('ws://localhost:8765'); // Connect to WebSocket server

        socket.onopen = function () {
            console.log('Connected to WebSocket server');
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            console.log('Received data:', data.samples);

            // Display the first 10 samples (or however you'd like)
            document.getElementById('data').innerText = data.samples.slice(0, 10).join(', ');
        };

        socket.onclose = function () {
            console.log('Disconnected from WebSocket server');
        };

        socket.onerror = function (error) {
            console.error('WebSocket Error:', error);
        };
    </script>
</body>
</html>
